[project]
name = "soliter"
version = "0.1.0"
description = "Long-horizon continual learning validation through embodied survival simulation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Stan Komarovsky", email = "your.email@example.com" }
]
dependencies = [
    # Core ML
    "torch>=2.1.0",
    "numpy>=1.24.0", # Neural Circuit Policies
    # Visualization
    "pygame>=2.5.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    # Data & Analysis
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    # Logging & Monitoring
    "tensorboard>=2.13.0",
    "wandb>=0.15.0",
    "tqdm>=4.65.0",
    # Utilities
    "pyyaml>=6.0",
    "h5py>=3.9.0", # For large replay buffer storage
    "dataclasses-json>=0.5.9",
    "omegaconf>=2.3.0",
    "ncps",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
]

[tool.uv.sources]
ncps = { path = "../ncps", editable = true }

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
